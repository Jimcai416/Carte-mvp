name = "dishlens-api"
main = "src/index.js"
compatibility_date = "2026-07-26"

[vars]
REQUIRE_CLIENT_ID = "true"
DAILY_SCAN_LIMIT = "20"
# Public prefix the stored dish images are served from. Left unset, the Worker
# uses its own /images route. Point this at a custom domain in front of the R2
# bucket to serve them from the edge instead.
# IMAGE_BASE_URL = "https://images.example.com"

# Dish image bytes — Commons photographs and generated illustrations alike.
# Create with:  npx wrangler r2 bucket create tavue-dish-images
[[r2_buckets]]
binding = "DISH_IMAGE_BUCKET"
bucket_name = "tavue-dish-images"

# Generated dish illustrations (@cf/black-forest-labs/flux-1-schnell).
[ai]
binding = "AI"

# Per-image source and attribution records. Optional: the pipeline falls back
# to the FEEDBACK namespace with isolated `img:` keys.
# Create with:  npx wrangler kv namespace create DISH_IMAGES
# [[kv_namespaces]]
# binding = "DISH_IMAGES"
# id = "YOUR_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "FEEDBACK"
id = "8cdef6ff25ef4c4a81d93f1603f07020"

# Beta events are strict, content-free data points. The dataset is created
# automatically on the first write and retains data for three months.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "carte_beta_events"

# Short-window limits prevent bursts from reaching the paid AI pipeline.
[[ratelimits]]
name = "SCAN_BURST_LIMITER"
namespace_id = "120260726"

  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "EVENTS_RATE_LIMITER"
namespace_id = "120260727"

  [ratelimits.simple]
  limit = 120
  period = 60

[observability]
enabled = true
head_sampling_rate = 1

# For larger public launches, create a dedicated namespace. The beta safely
# falls back to the existing FEEDBACK namespace with isolated `scan:` keys.
# [[kv_namespaces]]
# binding = "SCAN_LIMITS"
# id = "YOUR_SCAN_LIMITS_KV_ID"
